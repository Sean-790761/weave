name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # One source of truth for the Go version; setup-go caches modules and
          # build output on its own, so no separate cache step is needed.
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run Go tests
        run: make test

      - name: Install Python test deps
        run: pip install -r requirements-dev.txt

      - name: Run end-to-end tests
        # Deps are already installed on the runner, so reuse the ambient
        # interpreter instead of letting the Makefile build a venv.
        run: make SYSTEM_PYTHON=1 e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build for multiple platforms
        run: make build-all

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: weave-binaries
          path: bin/weave-*

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: Lint is a required check, so a new release adding a check
          # should not turn every open PR red without anyone touching them.
          version: v2.13.2
