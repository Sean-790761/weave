name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Run end-to-end tests
        run: bash test-e2e.sh

      - name: Build binary
        run: go build -o bin/weave ./cmd/weave

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Build for multiple platforms
        run: |
          GOOS=linux GOARCH=amd64 go build -o bin/weave-linux-amd64 ./cmd/weave
          GOOS=linux GOARCH=arm64 go build -o bin/weave-linux-arm64 ./cmd/weave
          GOOS=darwin GOARCH=amd64 go build -o bin/weave-darwin-amd64 ./cmd/weave
          GOOS=darwin GOARCH=arm64 go build -o bin/weave-darwin-arm64 ./cmd/weave

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weave-binaries
          path: bin/weave-*

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Check for common Go issues
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./... || true